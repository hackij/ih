<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernlandkarte Instandhaltung an Dach und Wand</title>
<meta name="theme-color" content="#F3F6FB">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/style.css">
<style>
  html,body{height:100%;overflow:hidden}
  #fit{position:fixed;inset:0;overflow:hidden}
  #stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center center;transform:translate(-50%,-50%) scale(.5)}
  #world{position:absolute;inset:0;perspective:1900px;perspective-origin:50% 50%}
  .view{position:absolute;inset:0;padding:30px 44px 0;transform-style:preserve-3d;will-change:transform,filter,opacity;
        transition:transform .85s cubic-bezier(.65,0,.25,1),filter .85s ease,opacity .75s ease}
  .brand-top{position:absolute;left:44px;top:26px;display:flex;align-items:center;gap:16px;z-index:5}
  .brand-top img{height:46px}
  .brand-top span{font:600 14px var(--f-b);letter-spacing:.22em;color:var(--slate-d);text-transform:uppercase}

  /* Mitte */
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:0 150px 30px}
  .center .eyebrow{font-size:15px}
  .center h1{font-size:62px;font-weight:800;line-height:1.02;text-align:center;margin:12px 0 26px;max-width:1150px}
  .phases{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;width:1170px;position:relative;margin-top:6px}
  .phases::before{content:"";position:absolute;left:8%;right:8%;top:38px;height:3px;background:linear-gradient(90deg,#9DC3E6,#2E75B6,#113277);border-radius:3px;z-index:0}
  .ph{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
  .ph .ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--navy);box-shadow:0 8px 22px rgba(17,50,119,.14), inset 0 0 0 3px #fff;position:relative}
  .ph .ic i{position:absolute;top:-4px;right:-4px;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font:700 13px/26px var(--f-b);font-style:normal}
  .ph .bx{padding:14px 14px 16px;border-radius:20px;width:100%;min-height:158px}
  .ph b.n{display:block;font:800 22px var(--f-d);color:var(--navy);margin-bottom:6px}
  .ph p{margin:0;font-size:15px;line-height:1.42;color:var(--slate-d)}
  .kw{border:0;padding:1px 6px;margin:0 -1px;border-radius:8px;font:700 15px var(--f-b);color:var(--blue);background:rgba(46,117,182,.10);cursor:pointer;line-height:1.5}
  .kw:hover,.kw.on{background:var(--blue);color:#fff}
  .pop{position:absolute;z-index:20;width:330px;background:rgba(255,255,255,.97)!important;box-shadow:0 20px 50px rgba(17,50,119,.22)!important;padding:18px 20px 16px;border-radius:22px;text-align:left;opacity:0;transform:translateY(8px) scale(.97);transition:.22s;pointer-events:none}
  .pop.on{opacity:1;transform:none;pointer-events:auto}
  .pop h4{margin:0 0 10px;font:800 24px var(--f-d);color:var(--navy)}
  .pop .row{display:flex;gap:10px;margin:8px 0;font-size:15px;line-height:1.4;color:var(--ink)}
  .pop .row span{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(46,117,182,.12);color:var(--blue)}
  .pop .go{margin-top:10px;border:0;border-radius:999px;padding:9px 14px;font:600 14px var(--f-b);background:var(--navy);color:#fff;display:inline-flex;gap:6px;align-items:center}
  .pop .x{position:absolute;right:12px;top:12px;border:0;background:rgba(17,50,119,.07);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--navy)}
  .wl{margin-top:26px;border:0;background:transparent;font:600 14px var(--f-b);color:var(--slate-d);display:inline-flex;gap:6px;align-items:center;text-decoration:underline;text-underline-offset:4px}
  .modal{position:absolute;inset:0;z-index:30;background:rgba(17,30,60,.25);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center}
  .modal.on{display:flex}
  .kompetenz{padding:24px 30px;max-width:1220px}
  .kompetenz h3{font:700 15px var(--f-b);letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
  .kompetenz .cols{column-count:2;column-gap:34px;font-size:14.6px;line-height:1.5;color:var(--slate-d)}
  .kompetenz .cols p{margin:0 0 9px;break-inside:avoid-column}
  .kompetenz .cols p:first-child{font-weight:600;color:var(--navy)}

  /* Richtungs-Schaltflächen */
  .dirbtn{position:absolute;z-index:6;display:flex;align-items:center;gap:12px;border:0;border-radius:20px;padding:12px 18px;
          font:700 17px var(--f-d);color:var(--navy);letter-spacing:.02em;max-width:330px;text-align:left;transition:transform .2s}
  .dirbtn:hover{transform:scale(1.04)}
  .dirbtn .ar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
  .dirbtn small{display:block;font:500 12px var(--f-b);color:var(--muted);letter-spacing:0}
  .dirbtn.bald .ar{background:rgba(17,50,119,.18)}
  .dirbtn.oben{top:22px;left:50%;transform:translateX(-50%)} .dirbtn.oben:hover{transform:translateX(-50%) scale(1.04)}
  .dirbtn.unten{bottom:22px;left:50%;transform:translateX(-50%)} .dirbtn.unten:hover{transform:translateX(-50%) scale(1.04)}
  .dirbtn.links{left:22px;top:50%;transform:translateY(-50%);flex-direction:column;align-items:flex-start;max-width:150px}
  .dirbtn.links:hover{transform:translateY(-50%) scale(1.04)}
  .dirbtn.rechts{right:22px;top:50%;transform:translateY(-50%);flex-direction:column;align-items:flex-end;text-align:right;max-width:170px}
  .dirbtn.rechts:hover{transform:translateY(-50%) scale(1.04)}
  .dirbtn.start{box-shadow:0 0 0 3px var(--c),var(--shadow)}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 7px rgba(46,117,182,.25),var(--shadow)}}

  /* Bereich */
  .area-head{display:flex;align-items:center;gap:16px;margin:4px 0 16px 0;padding-left:300px}
  .area-head .ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
  .area-head .eyebrow{color:var(--c)}
  .area-head h1{font-size:40px;font-weight:800;line-height:1.05}
  .slide{position:absolute;left:44px;right:44px;top:112px;bottom:92px}
  .slide h2{font-size:38px;font-weight:800;margin-bottom:6px}
  .slide .lead{font-size:19px;color:var(--slate-d);margin:0 0 16px;max-width:1100px}
  .navbar{position:absolute;left:44px;right:44px;bottom:20px;height:58px;display:flex;align-items:center;gap:10px;padding:7px;border-radius:22px;z-index:6}
  .navbar button{border:0;border-radius:16px;height:44px;padding:0 15px;font:600 14px var(--f-b);background:transparent;color:var(--slate-d);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .navbar .pills{display:flex;gap:4px;flex:1;overflow:hidden;justify-content:center}
  .navbar .pills button{padding:0 11px;font-size:13px}
  .navbar .pills button.on{background:var(--c);color:#fff}
  .navbar .home{background:rgba(17,50,119,.07);color:var(--navy)}
  .navbar .arr{width:44px;padding:0;justify-content:center;background:rgba(17,50,119,.07);color:var(--navy)}
  .navbar .arr:disabled{opacity:.3}

  /* Minikarte */
  .mini{position:absolute;right:30px;top:24px;z-index:7;display:grid;grid-template-columns:repeat(3,22px);grid-template-rows:repeat(3,22px);gap:4px;padding:8px;border-radius:16px}
  .mini b{border-radius:6px;background:rgba(17,50,119,.10);cursor:pointer}
  .mini b.on{background:var(--navy)}
  .mini b.x{visibility:hidden}

  /* Bausteine */
  .card2{padding:20px 24px}
  .big-in{font:700 34px var(--f-d);text-align:center;color:var(--navy);width:100%;border:2px solid var(--line);border-radius:16px;padding:10px;background:rgba(255,255,255,.9)}
  .dragc{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border:0;border-radius:16px;padding:12px 16px;font:600 17px/1.25 var(--f-b);
         background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(17,50,119,.12), inset 0 0 0 1.5px var(--line);text-align:left}
  .dragc.sel{box-shadow:0 0 0 4px var(--blue)}
  .dragc.ok{background:color-mix(in srgb,var(--c,#2F8A78) 12%,white);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c,#2F8A78) 45%,transparent);cursor:default;font-size:15px;padding:9px 12px}
  .dragc.ghost{position:fixed;z-index:100;pointer-events:none;transform:rotate(-2deg) scale(1.04);box-shadow:0 18px 40px rgba(17,50,119,.3)}
  .dragc.shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .drop{border-radius:20px;transition:background .15s, box-shadow .15s}
  .drop.hot{box-shadow:inset 0 0 0 3px var(--c,#2E75B6);background:color-mix(in srgb,var(--c,#2E75B6) 10%,transparent)}
  .fbk{border-radius:16px;padding:12px 16px;font-size:17px;line-height:1.4}
  .fbk.good{background:rgba(47,138,120,.13);color:#1d5a4e}
  .fbk.bad{background:rgba(163,35,58,.10);color:#7c1a2c}
  .btn2{border:0;border-radius:999px;padding:12px 20px;font:600 16px var(--f-b);background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:8px}
  .btn2.ghost{background:rgba(255,255,255,.85);color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--line)}
  .wobble{animation:wob 1.6s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes wob{25%{transform:rotate(-1.6deg)}75%{transform:rotate(1.6deg)}}
  .merke{border-left:5px solid var(--berry);background:rgba(163,35,58,.07);border-radius:0 16px 16px 0;padding:12px 18px;font-size:17px;line-height:1.45}
  .merke > b:first-child{display:block;color:var(--berry);font:700 13px var(--f-b);letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px}
  .soon{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i><i></i></div>
<div id="fit"><div id="stage">
  <div class="brand-top"><img src="assets/logos.png" alt="BS1 Spengler Bayreuth"></div>
  <div class="mini glass" id="mini"></div>
  <div id="world"></div>
</div></div>

<script src="config.js"></script>
<script src="assets/icons.js"></script>
<script src="karte.js"></script>
<script src="karte_ob.js"></script>
<script src="karte_ko.js"></script>
<script>
(function(){
  const K = window.LF_KARTE, F = window.KARTE_FOLIEN;
  const world = document.getElementById('world');
  const DIRS = ['oben','links','rechts','unten'];
  const VEC = { oben:[0,-1], unten:[0,1], links:[-1,0], rechts:[1,0], mitte:[0,0] };
  let cur = { area: 'mitte', i: 0 }, busy = false, viewEl = null;

  /* Pose für Ein- und Ausklappen: dx,dy = Richtung, aus der die neue Ansicht kommt */
  function pose(dx, dy, k){
    const t = 38 * k, r = 34 * k;
    return `translate3d(${dx*t}%, ${dy*t}%, ${-260*k}px) rotateX(${-dy*r}deg) rotateY(${dx*r}deg) scale(${1 - .14*k})`;
  }

  function render(state){
    const v = document.createElement('div'); v.className = 'view';
    if (state.area === 'mitte') renderCenter(v); else renderArea(v, state);
    return v;
  }

  function renderCenter(v){
    const kw = t => t.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (m, w, id) => `<button class="kw" data-kw="${id}">${w}</button>`);
    v.innerHTML = `<div class="center" style="justify-content:center;padding-top:20px">
        <div class="eyebrow">${K.lernfeld}</div>
        <h1 style="margin-bottom:12px">${K.titel}</h1>
        <p style="font-size:20px;color:var(--slate-d);margin:0 0 34px;text-align:center">Du führst Instandhaltungsmaßnahmen an Dach und Wand nach Kundenauftrag durch. Das heißt:</p>
        <div class="phases">${K.phasen.map((p, i) => `<div class="ph"><div class="ic">${ICON(p.icon,32)}<i>${i+1}</i></div>
          <div class="bx glass"><b class="n">${p.name}</b><p>${kw(p.text)}</p></div></div>`).join('')}</div>
        <button class="wl" data-wl>${ICON('info',16)} Kompetenzerwartung im Wortlaut</button>
      </div>
      <div class="pop glass" id="pop"></div>
      <div class="modal" id="wlM"><div class="kompetenz glass" style="position:relative;max-height:760px;overflow:auto"><button class="x" data-wlx style="position:absolute;right:16px;top:14px;border:0;background:rgba(17,50,119,.07);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--navy)">${ICON('x',18)}</button>
        <h3>Kompetenzerwartung (Lehrplan)</h3><div class="cols">${K.kompetenz.map(p => `<p>${p}</p>`).join('')}</div></div></div>` +
      DIRS.map(d => { const b = K.bereiche[d]; const ar = { oben:'M12 19V5M6 11l6-6 6 6', unten:'M12 5v14M6 13l6 6 6-6', links:'M19 12H5M11 6l-6 6 6 6', rechts:'M5 12h14M13 6l6 6-6 6' }[d];
        return `<button class="dirbtn glass ${d} ${b.status==='bald'?'bald':''} ${d==='oben'?'start pulse':''}" data-go="${d}" style="--c:${b.farbe}">
          <span class="ar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${ar}"/></svg></span>
          <span>${b.titel}<small>${b.status==='bald' ? 'folgt' : (d==='oben' ? 'Hier starten' : b.sub)}</small></span></button>`; }).join('');
    v.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go({ area: b.dataset.go, i: 0 }));
    const pop = v.querySelector('#pop');
    const close = () => { pop.classList.remove('on'); v.querySelectorAll('.kw.on').forEach(x => x.classList.remove('on')); };
    v.querySelectorAll('.kw').forEach(btn => btn.onclick = e => {
      e.stopPropagation();
      if (btn.classList.contains('on')) return close();
      close(); btn.classList.add('on');
      const B = K.begriffe[btn.dataset.kw]; if (!B) return;
      const z = B.ziel && K.bereiche[B.ziel[0]];
      pop.innerHTML = `<button class="x" aria-label="Schließen">${ICON('x',14)}</button><h4>${B.t}</h4>
        <div class="row"><span>${ICON('info',15)}</span><div><b>Warum wichtig?</b><br>${B.warum}</div></div>
        <div class="row"><span>${ICON('hammer',15)}</span><div><b>Als Spengler</b><br>${B.spengler}</div></div>
        ${z ? `<button class="go" data-z>${z.status === 'bald' ? ICON('lock',14) + ' Themenbereich folgt' : 'Zur Themenseite ' + ICON('pfeilR',14)}</button>` : ''}`;
      const k = window.KARTE_SCALE(), sr = document.getElementById('stage').getBoundingClientRect(), br = btn.getBoundingClientRect();
      let x = (br.left - sr.left) / k + br.width / k / 2 - 165, y = (br.bottom - sr.top) / k + 10;
      x = Math.max(20, Math.min(1600 - 350, x)); if (y > 900 - 270) y = (br.top - sr.top) / k - 260;
      pop.style.left = x + 'px'; pop.style.top = y + 'px';
      requestAnimationFrame(() => pop.classList.add('on'));
      pop.querySelector('.x').onclick = close;
      const zb = pop.querySelector('[data-z]'); if (zb) zb.onclick = () => go({ area: B.ziel[0], i: B.ziel[1] });
    });
    v.addEventListener('click', e => { if (!e.target.closest('.pop')) close(); });
    const m = v.querySelector('#wlM');
    v.querySelector('[data-wl]').onclick = e => { e.stopPropagation(); m.classList.add('on'); };
    v.querySelector('[data-wlx]').onclick = () => m.classList.remove('on');
    m.onclick = e => { if (e.target === m) m.classList.remove('on'); };
  }

  function renderArea(v, st){
    const b = K.bereiche[st.area];
    const list = b.folien.filter(id => F[id]);
    v.style.setProperty('--c', b.farbe);
    v.innerHTML = `<div class="area-head" style="--c:${b.farbe}"><div class="ic">${ICON(b.icon,26)}</div><div><div class="eyebrow">${b.sub}</div><h1>${b.titel}</h1></div></div>
      <div class="slide"></div>
      <div class="navbar glass" style="--c:${b.farbe}">
        <button class="home" data-home>${ICON('home',18)} Mitte</button>
        <button class="arr" data-prev ${st.i<=0?'disabled':''}>${ICON('pfeilR',18)}</button>
        <div class="pills">${list.map((id, i) => `<button data-i="${i}" class="${i===st.i?'on':''}">${i+1}. ${F[id].kurz}</button>`).join('')}</div>
        <button class="arr" data-next ${st.i>=list.length-1?'disabled':''}>${ICON('pfeilR',18)}</button>
      </div>`;
    v.querySelector('[data-prev]').firstElementChild.style.transform = 'scaleX(-1)';
    const slide = v.querySelector('.slide');
    if (!list.length) {
      slide.innerHTML = `<div class="soon"><div style="width:96px;height:96px;border-radius:30px;background:${b.farbe};color:#fff;display:grid;place-items:center;margin-bottom:22px">${ICON(b.icon,48)}</div>
        <h2 style="font-size:50px;max-width:1000px">${b.titel}</h2><p class="lead" style="font-size:22px">${b.sub}</p><span class="chip" style="font-size:15px;padding:9px 16px">${ICON('lock',16)} Dieser Themenbereich wird demnächst freigeschaltet</span></div>`;
      v.querySelector('.navbar .pills').innerHTML = '';
    } else {
      F[list[st.i]].render(slide, { farbe: b.farbe });
    }
    v.querySelector('[data-home]').onclick = () => go({ area: 'mitte', i: 0 });
    v.querySelector('[data-prev]').onclick = () => go({ area: st.area, i: st.i - 1 });
    v.querySelector('[data-next]').onclick = () => go({ area: st.area, i: st.i + 1 });
    v.querySelectorAll('.pills [data-i]').forEach(x => x.onclick = () => go({ area: st.area, i: +x.dataset.i }));
  }

  function dirOf(from, to){
    if (from.area === to.area) { const [x, y] = VEC[to.area]; const s = to.i > from.i ? 1 : -1; return [x*s, y*s, .55]; }
    if (to.area === 'mitte') { const [x, y] = VEC[from.area]; return [-x, -y, 1]; }
    if (from.area === 'mitte') { const [x, y] = VEC[to.area]; return [x, y, 1]; }
    const [x, y] = VEC[to.area]; return [x, y, 1];
  }

  function go(to, instant){
    if (busy) return;
    const b = K.bereiche[to.area];
    if (to.area !== 'mitte') { const n = b.folien.filter(id => F[id]).length; to.i = Math.max(0, Math.min(Math.max(n - 1, 0), to.i)); }
    if (to.area === cur.area && to.i === cur.i && viewEl) return;
    const nv = render(to);
    if (!viewEl || instant) { world.innerHTML = ''; world.appendChild(nv); viewEl = nv; cur = to; mini(); try { history.replaceState(null, '', to.area === 'mitte' ? location.pathname : '#' + to.area + '-' + (to.i+1)); } catch(e){} return; }
    busy = true;
    const [dx, dy, k] = dirOf(cur, to);
    nv.style.transition = 'none';
    nv.style.transform = pose(dx, dy, k); nv.style.filter = `blur(${18*k}px)`; nv.style.opacity = '0';
    world.appendChild(nv);
    const old = viewEl;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      nv.style.transition = '';
      nv.style.transform = 'none'; nv.style.filter = 'blur(0)'; nv.style.opacity = '1';
      old.style.transform = pose(-dx, -dy, k); old.style.filter = `blur(${18*k}px)`; old.style.opacity = '0';
    }));
    setTimeout(() => { old.remove(); nv.style.filter = 'none'; busy = false; }, 900);
    viewEl = nv; cur = to; mini();
    try { history.replaceState(null, '', to.area === 'mitte' ? location.pathname : '#' + to.area + '-' + (to.i+1)); } catch(e){}
  }

  function mini(){
    const pos = { oben:1, links:3, mitte:4, rechts:5, unten:7 };
    const m = document.getElementById('mini');
    m.innerHTML = [0,1,2,3,4,5,6,7,8].map(i => { const a = Object.keys(pos).find(k => pos[k] === i);
      return a ? `<b class="${cur.area===a?'on':''}" title="${a==='mitte'?'Mitte':K.bereiche[a].titel}" data-a="${a}"></b>` : '<b class="x"></b>'; }).join('');
    m.querySelectorAll('[data-a]').forEach(x => x.onclick = () => go({ area: x.dataset.a, i: 0 }));
  }

  document.addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA/.test(e.target.tagName) || e.target.isContentEditable) return;
    const map = { ArrowUp:'oben', ArrowDown:'unten', ArrowLeft:'links', ArrowRight:'rechts' };
    if (e.key === 'Escape') return go({ area:'mitte', i:0 });
    if (!map[e.key]) return;
    e.preventDefault();
    if (cur.area === 'mitte') return go({ area: map[e.key], i: 0 });
    const fwd = cur.area, back = { oben:'unten', unten:'oben', links:'rechts', rechts:'links' }[cur.area];
    if (map[e.key] === fwd) go({ area: cur.area, i: cur.i + 1 });
    else if (map[e.key] === back) { if (cur.i === 0) go({ area:'mitte', i:0 }); else go({ area: cur.area, i: cur.i - 1 }); }
  });

  function dims(){ const de = document.documentElement;
    const w = innerWidth || de.clientWidth || (window.visualViewport && visualViewport.width) || 0;
    const h = innerHeight || de.clientHeight || (window.visualViewport && visualViewport.height) || 0;
    return [w, h]; }
  function scaleNow(){ const [w, h] = dims(); const k = Math.min(w/1600, h/900); return k > 0.05 ? k : (w > 0 ? w/1600 : 1); }
  function fit(){ document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${scaleNow()})`; }
  addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  try { new ResizeObserver(fit).observe(document.documentElement); } catch(e){}
  fit(); requestAnimationFrame(fit); setTimeout(fit, 300); setTimeout(fit, 1200);
  window.KARTE_SCALE = scaleNow;
  window.KARTE_GO = (area, i) => go({ area, i });

  let h0 = null; try { h0 = (location.hash || '').slice(1).match(/^(oben|links|rechts|unten)-(\d+)$/); } catch(e){}
  try { go(h0 ? { area: h0[1], i: +h0[2] - 1 } : { area: 'mitte', i: 0 }, true); }
  catch(e){ console.error(e); busy = false; viewEl = null; go({ area: 'mitte', i: 0 }, true); }
})();
</script>
